<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGHSCORES - SCHWEINEHUND</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', monospace; max-width: 1000px; margin: 0 auto; padding: 20px; background: #000; color: #fff; box-sizing: border-box; line-height: 1.6; }
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05)); z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        .brand-bar { background: #111; padding: 20px; border: 4px solid #333; box-shadow: 0 0 0 4px #000, 0 0 0 6px #ff00ff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .brand-logo-title { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #ff00ff; }
        .nav-link { color: #00ffff; text-decoration: none; padding: 10px 14px; border: 2px solid #333; background: #000; font-size: 12px; font-weight: bold; }
        .nav-link:hover { border-color: #00ffff; }
        .graph-container { background: #111; padding: 30px; margin-bottom: 30px; border: 4px solid #333; box-shadow: 0 0 0 4px #000, 0 0 0 6px #222; text-align: center; }
        h1 { color: #ffff00; font-size: 18px; margin-bottom: 35px; text-align: center; text-shadow: 2px 2px #000; letter-spacing: 1px; }
        img { max-width: 100%; height: auto; border: 4px solid #333; image-rendering: pixelated; filter: grayscale(20%) contrast(120%); }
    </style>
</head>
<body>
    <div class="brand-bar">
        <div class="brand-logo-title">👾 SCHWEINEHUND_</div>
        <a class="nav-link" href="/dashboard">&larr; BACK</a>
    </div>

    <h1>⚔️ HIGHSCORE RECORDS ⚔️</h1>

    <div class="graph-container">
        <img src="data:image/png;base64,{{ week_graph }}" alt="Wochen-Graph">
    </div>
    <div class="graph-container">
        <img src="data:image/png;base64,{{ month_graph }}" alt="Monats-Graph">
    </div>
    <div class="graph-container">
        <img src="data:image/png;base64,{{ year_graph }}" alt="Jahres-Graph">
    </div>
</body>
</html>
