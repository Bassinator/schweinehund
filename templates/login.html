<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - SCHWEINEHUND 8-BIT</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', monospace; background: #000; color: #00ff00; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; box-sizing: border-box; overflow-x: hidden; line-height: 1.5; }
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        .login-card { background: #111; padding: 40px; border-radius: 4px; border: 4px solid #333; box-shadow: 0 0 0 4px #000, 0 0 0 8px #00ff00; width: 100%; max-width: 480px; text-align: center; }
        .boss-area { font-size: 60px; margin-bottom: 25px; animation: pixel-bounce 1s infinite steps(2); }
        .app-title { font-size: 22px; font-weight: bold; color: #ff00ff; margin: 0 0 20px 0; text-shadow: 3px 3px #000; letter-spacing: 1px; }
        .app-subtitle { font-size: 11px; color: #00ffff; margin-bottom: 40px; line-height: 1.8; text-transform: uppercase; }
        .form-group { margin-bottom: 30px; text-align: left; }
        label { display: block; margin-bottom: 12px; font-size: 13px; color: #ffff00; letter-spacing: 0.5px; }
        input { width: 100%; padding: 16px; box-sizing: border-box; border: 4px solid #333; background: #000; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 14px; image-rendering: pixelated; }
        input:focus { border-color: #00ff00; outline: none; }
        .btn-group { display: flex; gap: 15px; margin-top: 35px; flex-direction: column; }
        .btn { padding: 18px; border: 4px solid #333; cursor: pointer; font-family: 'Press Start 2P', monospace; font-weight: bold; color: white; font-size: 13px; text-transform: uppercase; transition: all 0.1s; box-shadow: inset -4px -4px #000; letter-spacing: 0.5px; }
        .btn:active { box-shadow: inset 4px 4px #000; transform: translateY(2px); }
        .btn-login { background: #2196F3; border-color: #64b5f6; }
        .btn-register { background: #4CAF50; border-color: #81c784; }
        .flash { color: #ff0000; background: #200; border: 4px solid #ff0000; padding: 14px; margin-bottom: 30px; font-size: 11px; line-height: 1.6; }
        @keyframes pixel-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="boss-area">👾</div>
        <h1 class="app-title">SH-BOSS BATTLE</h1>
        <div class="app-subtitle">> BESIEGE DEN SCHWEINEHUND!<br>> INSERT CREDENTIALS TO START</div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">! ERROR: {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">HERO NAME:</label>
                <input type="text" id="username" name="username" placeholder="PLAYER 1" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">PASS KEY:</label>
                <input type="password" id="password" name="password" placeholder="******" required>
            </div>
            <div class="btn-group">
                <button type="submit" name="action" value="login" class="btn btn-login">CONTINUE [LOAD]</button>
                <button type="submit" name="action" value="register" class="btn btn-register">NEW GAME [START]</button>
            </div>
        </form>
    </div>
</body>
</html>
