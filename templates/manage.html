<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEST SMITH - SCHWEINEHUND</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', monospace; max-width: 850px; margin: 0 auto; padding: 20px; background: #000; color: #fff; box-sizing: border-box; line-height: 1.6; }
        body::before { content: " "; display: block; position: fixed; top: 0; bottom: 0; left: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05)); z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none; }
        .brand-bar { background: #111; padding: 20px; border: 4px solid #333; box-shadow: 0 0 0 4px #000, 0 0 0 6px #ff00ff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .brand-logo-title { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #ff00ff; }
        .nav-link { color: #00ffff; text-decoration: none; padding: 10px 14px; border: 2px solid #333; background: #000; font-size: 12px; font-weight: bold; }
        .nav-link:hover { border-color: #00ffff; }
        .form-card { background: #111; padding: 35px; border: 4px solid #333; box-shadow: 0 0 0 4px #000, 0 0 0 6px #222; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 12px; font-size: 11px; color: #ffff00; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; box-sizing: border-box; border: 4px solid #333; background: #000; color: white; font-family: 'Press Start 2P', monospace; font-size: 12px; }
        input:focus { border-color: #00ff00; outline: none; }
        .row { display: flex; gap: 20px; flex-direction: column; }
        @media(min-width: 600px) { .row { flex-direction: row; } }
        .btn-submit { background: #4CAF50; color: white; padding: 18px; border: 4px solid #81c784; cursor: pointer; width: 100%; font-size: 13px; font-family: 'Press Start 2P', monospace; font-weight: bold; margin-top: 20px; box-shadow: inset -4px -4px #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-submit:active { box-shadow: inset 4px 4px #000; transform: translateY(2px); }
        .task-list-item { background: #111; padding: 20px; margin-top: 20px; border: 4px solid #333; display: flex; justify-content: space-between; align-items: center; font-size: 11px; line-height: 1.6; }
        .btn-delete { background: #ef4444; border: 2px solid #ff7961; color: white; padding: 8px 12px; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: bold; }
        h2 { color: #ff00ff; font-size: 15px; margin-top: 0; text-shadow: 1px 1px #000; }
    </style>
</head>
<body>
    <div class="brand-bar">
        <div class="brand-logo-title">👾 SCHWEINEHUND_</div>
        <a class="nav-link" href="/dashboard">&larr; BACK</a>
    </div>

    <div class="form-card">
        <h2>⚔️ CRAFT NEW QUEST </h2>
        <form method="POST">
            <div class="form-group">
                <label for="title">MISSION OBJECTIVE:</label>
                <input type="text" id="title" name="title" placeholder="e.g. RUNNING OR CODING" required autocomplete="off">
            </div>
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>LVL 1 REQ:</label>
                    <input type="text" name="stage1_text" placeholder="e.g. 3 KM" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>XP BOUNTY:</label>
                    <input type="number" name="stage1_points" value="10" required>
                </div>
            </div>
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>MAX REQ (BONUS):</label>
                    <input type="text" name="stage2_text" placeholder="e.g. 10 KM" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>XP BOUNTY:</label>
                    <input type="number" name="stage2_points" value="25" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">[DEPLOY MISSION]</button>
        </form>
    </div>

    <h2 style="margin-top: 45px;">ACTIVE OBJECTIVES</h2>
    {% for task in tasks %}
    <div class="task-list-item">
        <span>> <strong>{{ task.title }}</strong> (<span style="color: #ff9800;">{{ task.stage1_text }}</span>/<span style="color: #2196F3;">{{ task.stage2_text }}</span>)</span>
        <form action="/delete/{{ task.id }}" method="POST">
            <button type="submit" class="btn-delete">[ABORT]</button>
        </form>
    </div>
    {% endfor %}
</body>
</html>
